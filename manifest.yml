plugin:
  name: fylr-plugin-detail-map
  version: "1.0"
  url: https://github.com/programmfabrik/fylr-plugin-detail-map
  displayname:
    de-DE: "Detail Map Plugin"
    en-US: "Detail Map Plugin"
  info:
    de-DE: |
      Zeigt die Dateien eines Datensatzes in der Detailansicht auf einer Karte an, sodass georeferenzierte Medien an ihrem Aufnahmeort verortet werden. Über eine Feldoption lässt sich steuern, ob eine Datei auf der Karte erscheint, und die Basiskonfiguration bestimmt den Kartenanbieter.

      - Zeigt Dateipositionen auf einer Karte in der Detailansicht
      - Wahl zwischen [OpenStreetMap](https://www.openstreetmap.org)- oder [Mapbox](https://www.mapbox.com)-Kacheln
    en-US: |
      Shows a record's files on a map in the detail view, so geolocated media can be placed on their capture location. A per-field option controls whether a file appears on the map, and the base configuration lets you choose the tile provider.

      - Displays file locations on a map in the detail view
      - Choose [OpenStreetMap](https://www.openstreetmap.org) or [Mapbox](https://www.mapbox.com) tiles
  l10n: l10n/fylr-plugin-detail-map.csv
  webfrontend:
    url: fylr-plugin-detail-map.js
    css: fylr-plugin-detail-map.css
    type_extension:
      mask:
        eas:
          - name: map
            group: detail
            parameters:
              show_in_map:
                type: bool
                default: true

base_url_prefix: "webfrontend"

base_config:
  - name: detail_map
    parameters:
      enabled:
        position: 0
        type: bool
      tiles:
        position: 1
        type: select
        options: ["OpenStreetMaps", "Mapbox"]
        default: "OpenStreetMaps"
      mapboxToken:
        position: 2
        type: text
